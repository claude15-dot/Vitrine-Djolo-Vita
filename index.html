<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine Djolo Vita Bien-Être – Contactez-nous</title>
<meta name="description" content="Tisanes bien-être Wettia. Contactez-nous sur WhatsApp, TikTok, Facebook ou par téléphone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15110e;
    --ink:#f4ece0;
    --muted:#b9ab97;
    --gold:#d9bf94;
    --line:rgba(217,191,148,.35);
  }
  *{box-sizing:border-box;margin:0}
  html{background:var(--bg)}
  body{
    font-family:'Jost',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto}

  /* Hero : la photo respire lentement, c'est l'unique animation continue */
  .hero{
    position:relative;height:62vh;min-height:360px;max-height:560px;overflow:hidden;
    background:linear-gradient(160deg,#3a2c20,#15110e);
  }
  .hero img{
    width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;
    animation:zoom 18s ease-in-out infinite alternate;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(21,17,14,0) 30%,var(--bg) 100%);
  }
  .title{
    position:absolute;left:0;right:0;bottom:18px;z-index:2;padding:0 24px;
  }
  h1{
    font-family:'Bodoni Moda',serif;font-weight:500;font-size:clamp(2rem,9vw,2.8rem);
    line-height:1.1;letter-spacing:.01em;
  }
  .tag{color:var(--muted);margin-top:8px;font-size:1rem}

  /* Boutons */
  .actions{display:grid;gap:12px;padding:20px 24px 8px}
  .btn{
    display:flex;align-items:center;gap:14px;
    padding:16px 20px;border:1px solid var(--line);border-radius:999px;
    color:var(--ink);text-decoration:none;font-size:1.05rem;font-weight:500;
    background:rgba(255,255,255,.03);
    opacity:0;transform:translateY(14px);
    animation:in .6s cubic-bezier(.2,.7,.2,1) forwards;
    transition:background .25s,color .25s,transform .15s,border-color .25s;
  }
  .btn:nth-child(1){animation-delay:.2s}
  .btn:nth-child(2){animation-delay:.32s}
  .btn:nth-child(3){animation-delay:.44s}
  .btn:nth-child(4){animation-delay:.56s}
  .btn svg{width:24px;height:24px;flex:none;fill:currentColor}
  .btn span{flex:1;text-align:left}
  .btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .btn.main{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  .btn.main:hover,.btn.main:focus-visible{background:var(--ink);border-color:var(--ink)}

  /* Photos */
  .strip{
    display:flex;gap:10px;overflow-x:auto;padding:28px 24px 8px;
    scroll-snap-type:x mandatory;scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .strip button{flex:none;height:280px;padding:0;border:0;border-radius:14px;overflow:hidden;scroll-snap-align:center;background:#241b14;cursor:zoom-in}
  .strip img{height:100%;width:auto;display:block}
  .lb{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,8,6,.95)}
  .lb[hidden]{display:none}
  .lb img{max-width:100%;max-height:80vh;border-radius:10px;object-fit:contain}
  .lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(21,17,14,.7);color:var(--ink);font-size:1.6rem;line-height:1;cursor:pointer}
  .lb .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
  .lb .p{left:8px;top:50%}
  .lb .n{right:8px;top:50%}

  footer{padding:28px 24px 40px;color:var(--muted);font-size:.9rem}

  @keyframes in{to{opacity:1;transform:none}}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){
    .hero img{animation:none}
    .btn{animation:none;opacity:1;transform:none}
  }
</style>
</head>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <button class="x" type="button" aria-label="Fermer">&times;</button>
  <button class="p" type="button" aria-label="Photo précédente">&#8249;</button>
  <img alt="">
  <button class="n" type="button" aria-label="Photo suivante">&#8250;</button>
</div>
<script>
(function(){
  var imgs=[].slice.call(document.querySelectorAll('.strip img')),lb=document.getElementById('lb'),big=lb.querySelector('img'),i=0;
  function show(n){i=(n+imgs.length)%imgs.length;big.src=imgs[i].src;big.alt=imgs[i].alt;}
  function open(n){show(n);lb.hidden=false;}
  function close(){lb.hidden=true;}
  imgs.forEach(function(im,n){im.parentNode.addEventListener('click',function(){open(n)});});
  lb.querySelector('.x').onclick=close;
  lb.querySelector('.p').onclick=function(){show(i-1)};
  lb.querySelector('.n').onclick=function(){show(i+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)close()});
  document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);});
})();
</script>
